<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイムライン — Studio</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/primitives.css">
  <link rel="stylesheet" href="../styles/samples.css">
</head>
<body data-page="timeline">
  <main class="app-page app-workspace">
    <header class="app-header">
      <h1 class="ui-heading">タイムライン</h1>
      <div class="app-segments" id="timeline-view" role="radiogroup" aria-label="タイムラインの表示">
        <button type="button" role="radio" aria-checked="true" data-value="schedule">スケジュール</button>
        <button type="button" role="radio" aria-checked="false" data-value="activity">アクティビティ</button>
      </div>
    </header>
    <section id="schedule" aria-labelledby="period-label">
      <header class="app-contextbar">
        <div class="app-period-heading">
          <h2 id="period-label">2026年10月</h2>
          <p id="week-label" aria-live="polite">10月5日 — 11日</p>
        </div>
        <div class="app-control-group" role="group" aria-label="表示する週">
          <button class="app-icon-button" id="prev-week" type="button" aria-label="前の週"></button>
          <button class="ui-button" data-variant="secondary" data-density="compact" id="this-week" type="button">今週</button>
          <button class="app-icon-button" id="next-week" type="button" aria-label="次の週"></button>
        </div>
      </header>
      <div class="app-timeline-scroll" tabindex="0" aria-label="制作スケジュール。横にスクロールできます">
        <div class="app-timeline" id="timeline-grid"></div>
      </div>
    </section>
    <section id="activity-panel" aria-labelledby="activity-heading" hidden>
      <header class="app-contextbar"><div class="app-period-heading"><h2 id="activity-heading">今日のアクティビティ</h2><p>10月7日</p></div></header>
      <div class="app-workspace-body"><ol class="app-activity" id="activity-list"></ol></div>
    </section>
    <footer class="app-statusbar"><span id="timeline-summary"></span><span>サンプルデータ</span></footer>
    <dialog class="app-dialog" id="project-dialog" aria-labelledby="project-title">
      <h2 id="project-title"></h2><div id="project-detail"></div>
      <form method="dialog" class="ui-actions"><button class="ui-button" data-variant="secondary">閉じる</button></form>
    </dialog>
  </main>
  <script type="module" src="../samples/timeline.mjs"></script>
</body>
</html>
