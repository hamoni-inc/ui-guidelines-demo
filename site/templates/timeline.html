<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>タイムライン — Studio</title><link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/primitives.css"><link rel="stylesheet" href="../styles/samples.css"></head>
<body data-page="timeline"><main class="app-page">
  <header class="app-header"><div><h1 class="ui-heading">タイムライン</h1><p class="ui-description">制作の予定と、チームのアクティビティ</p></div><div class="app-segments" id="timeline-view" role="radiogroup" aria-label="タイムラインの表示"><button type="button" role="radio" aria-checked="true" data-value="schedule">スケジュール</button><button type="button" role="radio" aria-checked="false" data-value="activity">アクティビティ</button></div></header>
  <section class="app-panel" id="schedule"><header class="app-panel-heading"><h2 id="week-label">10月5日 — 11日</h2><div class="app-toolbar"><button class="app-icon-button" id="prev-week" type="button" aria-label="前の週"></button><button class="ui-button" data-variant="tertiary" data-density="compact" id="this-week" type="button">今週</button><button class="app-icon-button" id="next-week" type="button" aria-label="次の週"></button></div></header><div class="app-timeline-scroll" tabindex="0" aria-label="制作スケジュール。横にスクロールできます"><div class="app-timeline" id="timeline-grid"></div></div></section>
  <section class="app-panel" id="activity-panel" hidden><header class="app-panel-heading"><h2>今日 · 10月7日</h2></header><div class="app-panel-body"><ol class="app-activity" id="activity-list"></ol></div></section>
  <p class="app-caption">サンプルデータ · 予定を選択すると詳細を確認できます。</p>
  <dialog class="app-dialog" id="project-dialog" aria-labelledby="project-title"><h2 id="project-title"></h2><div id="project-detail"></div><form method="dialog" class="ui-actions"><button class="ui-button" data-variant="secondary">閉じる</button></form></dialog>
</main><script type="module" src="../samples/timeline.mjs"></script></body></html>
